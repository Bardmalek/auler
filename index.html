/* AULER · میز فرمان — styles
   Layout: control-room console. Right-hand rail (RTL) for modules, a thin status strip on top,
   and a 12-column module canvas. Brand: AULER Brand Guidelines v1.0 — monochrome only,
   sharp 2px corners, no gradients / glows / shadows, one rake pattern (2:5 slope) for non-text areas. */

:root {
  /* brand palette */
  --c-black: #0B0B0F;
  --c-white: #EDEDED;
  --c-graphite: #16161B;
  --c-line: #26262E;
  --c-steel: #8A8A92;
  --c-grey1: #B4B4BA;
  --c-grey3: #55555C;

  /* semantic — dark is the brand default */
  --bg: #0B0B0F;
  --surface: #16161B;
  --raised: #1C1C22;
  --border: #26262E;
  --border-strong: #3A3A44;
  --text: #EDEDED;
  --muted: #8A8A92;
  --faint: #55555C;
  --hl: #EDEDED;          /* highlight = off-white */
  --on-hl: #0B0B0F;
  --s1: #EDEDED; --s2: #B4B4BA; --s3: #8A8A92; --s4: #55555C;   /* chart series order */
  --grid: #26262E;
  --hatch: rgba(237, 237, 237, .62);
  --pat: #1A1A20;          /* rake pattern: graphite on black */
  --scrim: rgba(11, 11, 15, .86);

  /* type */
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;  /* Latin headlines + instrument numerals, stretch 125% */
  --font-fa: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;          /* all Persian text */
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;    /* labels, codes, data */

  --t-label: .75rem;   /* 12 */
  --t-small: .8125rem; /* 13 */
  --t-body: .9375rem;  /* 15 */
  --t-lead: 1.125rem;
  --t-h3: 1.375rem;
  --t-h2: 1.875rem;
  --t-h1: 2.5rem;

  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp6: 24px; --sp8: 32px; --sp12: 48px;
  --radius: 2px;
  --rail: 264px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg: #EDEDED;
  --surface: #FFFFFF;
  --raised: #F5F5F6;
  --border: #D4D4D8;
  --border-strong: #B4B4BA;
  --text: #0B0B0F;
  --muted: #55555C;
  --faint: #8A8A92;
  --hl: #0B0B0F;
  --on-hl: #EDEDED;
  --s1: #0B0B0F; --s2: #55555C; --s3: #8A8A92; --s4: #B4B4BA;
  --grid: #E3E3E6;
  --hatch: rgba(11, 11, 15, .62);
  --pat: #DCDCE0;
  --scrim: rgba(237, 237, 237, .9);
  color-scheme: light;
}

html { font-size: 15px; }
@media (min-width: 1680px) { html { font-size: 16px; } }
@media (min-width: 2200px) { html { font-size: 18px; } }
@media (min-width: 3000px) { html { font-size: 22px; } }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-fa);
  font-size: var(--t-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--hl); color: var(--on-hl); }
:focus-visible { outline: 2px solid var(--hl); outline-offset: 2px; }

html[lang="en"] body { font-family: "Archivo", var(--font-fa); font-stretch: 100%; }
html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3 { font-family: var(--font-display); font-stretch: 125%; font-weight: 700; letter-spacing: -.01em; }
html[lang="en"] .topbar h1 { font-size: 1.3rem; }
html[lang="en"] .hello h2, html[lang="en"] .manifesto h2 { line-height: 1.15; }
html[lang="en"] .hello h2 { font-size: 1.75rem; }
html[lang="en"] .page-head .pitch { line-height: 1.6; }
[lang="fa"] { font-family: var(--font-fa); }
.tr { font-size: var(--t-small); color: var(--muted); line-height: 1.7; border-inline-start: 2px solid var(--border-strong); padding-inline-start: 10px; }
.tr .label { display: block; margin-bottom: 2px; }

/* ---------- primitives ---------- */
.n, .num {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  direction: ltr;
  unicode-bidi: isolate;
  display: inline-block;
}
.disp {
  font-family: var(--font-display);
  font-stretch: 125%;
  font-weight: 700;
  direction: ltr;
  unicode-bidi: isolate;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  line-height: 1;
}
.label {
  font-family: var(--font-mono);
  font-size: var(--t-label);
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  direction: ltr;
  unicode-bidi: isolate;
}
.lbl { font-size: var(--t-small); color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: var(--t-small); }
.tiny { font-size: var(--t-label); }
.strong { font-weight: 700; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.nowrap { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.hatch {
  background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 6px);
}
.rake {
  background-image: repeating-linear-gradient(111.8deg, var(--pat) 0 2px, transparent 2px 14px);
}

.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: butt; }
.ico.sm { width: 16px; height: 16px; }
.ico.lg { width: 28px; height: 28px; stroke-width: 1.6; }

/* ---------- shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  height: 100%;
}
.rail {
  border-inline-end: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--bg);
}
.rail-logo { padding: 26px 22px 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rail-logo svg { width: 128px; height: auto; display: block; }
.rail-logo svg path, .rail-logo svg text { fill: var(--text); }
.rail-logo .logo-en { display: none; width: 132px; }
html[lang="en"] .rail-logo .logo-fa { display: none; }
html[lang="en"] .rail-logo .logo-en { display: block; }
.rail-logo .label { font-size: 10px; }
.rail-nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group > .gl { font-size: var(--t-label); color: var(--faint); padding: 6px 10px 4px; font-weight: 500; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: none;
  color: var(--muted);
  text-align: start;
  font-size: var(--t-small);
  font-weight: 500;
  transition: color .15s, background-color .15s, border-color .15s;
  width: 100%;
}
.nav-item:hover { color: var(--text); border-color: var(--border); }
.nav-item .code { margin-inline-start: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); letter-spacing: .06em; }
.nav-item[aria-current="page"] { background: var(--hl); color: var(--on-hl); }
.nav-item[aria-current="page"] .code { color: var(--on-hl); opacity: .7; }

.rail-status { border-top: 1px solid var(--border); padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.st-row { display: flex; align-items: center; gap: 10px; font-size: var(--t-small); }
.st-row .k { color: var(--muted); }
.st-row .v { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hl); flex: none; }
.dot.off { background: transparent; border: 1.5px solid var(--muted); }
.dot.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.st-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  min-height: 72px;
}
.topbar .ttl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.topbar h1 { margin: 0; font-size: var(--t-h3); font-weight: 800; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .tools { margin-inline-start: auto; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.clock { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.25; padding-inline-end: 8px; border-inline-end: 1px solid var(--border); margin-inline-end: 4px; }
.clock .t { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 500; direction: ltr; }
.clock .d { font-size: var(--t-label); color: var(--muted); }
.demo-badge { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; border: 1px dashed var(--border-strong); color: var(--muted); padding: 3px 7px; border-radius: var(--radius); white-space: nowrap; }

.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 28px 96px; scroll-behavior: smooth; }
.view-inner { max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; animation: viewIn .35s var(--ease); }
@keyframes viewIn { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- buttons, chips, pills ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: transparent;
  font-size: var(--t-small);
  font-weight: 600;
  white-space: nowrap;
  transition: background-color .15s, color .15s, border-color .15s, opacity .15s;
}
.btn:hover { border-color: var(--text); }
.btn.primary { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }
.btn.primary:hover { opacity: .88; }
.btn.icon { padding: 8px; }
.btn.sm { padding: 5px 10px; font-size: var(--t-label); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.on { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: transparent;
  font-size: var(--t-small);
  color: var(--muted);
  transition: color .15s, border-color .15s, background-color .15s;
}
.chip:hover { color: var(--text); border-color: var(--text); }
.chip[aria-pressed="true"] { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }

.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 2px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: var(--t-small); color: var(--muted); border-radius: 1px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--hl); color: var(--on-hl); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: var(--t-label);
  padding: 2px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  color: var(--muted);
  white-space: nowrap;
  line-height: 1.6;
  font-weight: 500;
}
.pill.solid { background: var(--hl); color: var(--on-hl); border-color: var(--hl); font-weight: 700; }
.pill.warn { border-color: var(--text); color: var(--text); }
.pill.risk { border-color: var(--text); color: var(--text); font-weight: 700; }
.pill.risk::before { content: ""; width: 9px; height: 9px; flex: none; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 3.5px); outline: 1px solid var(--text); }
.pill .ico { width: 12px; height: 12px; stroke-width: 2.4; }

/* ---------- cards & grid ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.card.flat { background: transparent; }
.card.tight { padding: 16px; gap: 10px; }
.card-h { display: flex; align-items: flex-start; gap: 12px; }
.card-h h2, .card-h h3 { margin: 0; font-size: 1rem; font-weight: 800; line-height: 1.4; }
.card-h .sub { font-size: var(--t-small); color: var(--muted); margin-top: 2px; }
.card-h .end { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.divider { height: 1px; background: var(--border); margin: 2px 0; }

.page-head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.page-head .pitch { max-width: 70ch; font-size: var(--t-lead); line-height: 1.7; margin: 0; font-weight: 400; text-wrap: pretty; }
.page-head .pitch b { font-weight: 800; }
.page-head .meta { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* KPI tile */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0;
  text-align: start;
}
button.kpi { cursor: pointer; transition: border-color .15s; }
button.kpi:hover { border-color: var(--border-strong); }
.kpi .top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--t-small); }
.kpi .top .code { margin-inline-start: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); letter-spacing: .06em; }
.kpi .val { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kpi .val .disp { font-size: 2.6rem; }
.kpi .val .u { font-size: var(--t-small); color: var(--muted); }
.kpi .foot { display: flex; align-items: center; gap: 10px; font-size: var(--t-label); color: var(--muted); min-height: 28px; }
.kpi .foot svg { margin-inline-start: auto; flex: none; }
.delta { font-family: var(--font-mono); font-size: var(--t-label); direction: ltr; unicode-bidi: isolate; white-space: nowrap; }

/* meter */
.meter { height: 6px; background: var(--border); border-radius: 1px; overflow: hidden; position: relative; }
.meter > i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--s1); display: block; transition: width .6s var(--ease); }
.meter.hatchfill > i { background: none; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 4px); }

/* table */
.tbl-wrap { overflow-x: auto; margin: 0 -4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.tbl th { text-align: start; font-weight: 500; color: var(--muted); font-size: var(--t-label); padding: 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.num, .tbl th.num { text-align: end; }
.tbl tbody tr.click { cursor: pointer; transition: background-color .12s; }
.tbl tbody tr.click:hover { background: var(--raised); }
.tbl tbody tr.sel { background: var(--raised); box-shadow: none; outline: 1px solid var(--border-strong); outline-offset: -1px; }
.tbl .sku { display: flex; flex-direction: column; line-height: 1.35; }
.tbl .sku .n { font-size: 10.5px; color: var(--faint); }

/* feed */
.feed { display: flex; flex-direction: column; overflow: hidden; }
.feed-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: start; animation: feedIn .5s var(--ease); }
.feed-item:last-child { border-bottom: 0; }
.feed-item .ic { width: 30px; height: 30px; border: 1px solid var(--border-strong); border-radius: var(--radius); display: grid; place-items: center; color: var(--text); }
.feed-item .ic .ico { width: 16px; height: 16px; }
.feed-item .tx { font-size: var(--t-small); line-height: 1.55; min-width: 0; }
.feed-item .tx .m { color: var(--muted); font-size: var(--t-label); }
.feed-item .tm { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); direction: ltr; }
@keyframes feedIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* tooltip & toast */
.tip {
  position: fixed; z-index: 60; pointer-events: none;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 8px 10px; font-size: var(--t-small); line-height: 1.5; max-width: 280px;
  opacity: 0; transition: opacity .12s;
}
.tip.on { opacity: 1; }
.tip .tt { font-weight: 700; margin-bottom: 2px; }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  background: var(--hl); color: var(--on-hl); padding: 10px 16px; border-radius: var(--radius);
  font-size: var(--t-small); font-weight: 600; display: flex; gap: 10px; align-items: center;
  animation: toastIn .3s var(--ease); max-width: min(560px, 90vw);
}
.toast .ico { width: 16px; height: 16px; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* tour caption */
.tourbar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 50;
  background: var(--hl); color: var(--on-hl);
  display: flex; align-items: center; gap: 20px;
  padding: 14px max(28px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
}
.tourbar .code { font-family: var(--font-mono); font-size: var(--t-label); letter-spacing: .08em; opacity: .7; white-space: nowrap; }
.tourbar .cap { font-size: 1.15rem; font-weight: 700; line-height: 1.55; flex: 1; min-width: 0; }
.tourbar .prog { width: 120px; height: 3px; background: rgba(127, 127, 127, .35); position: relative; flex: none; }
.tourbar .prog i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--on-hl); width: 0; }
.tourbar .btn { border-color: var(--on-hl); color: var(--on-hl); }

/* power overlay */
.power {
  position: fixed; inset: 0; z-index: 80; background: var(--scrim);
  display: grid; place-items: center; padding: 24px;
  animation: fadeIn .25s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.power-box { width: min(560px, 100%); background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.power-box h2 { margin: 0; font-size: var(--t-h3); font-weight: 800; }
.power-steps { display: flex; flex-direction: column; gap: 10px; }
.power-steps .ps { display: flex; gap: 12px; align-items: center; font-size: var(--t-small); color: var(--faint); transition: color .3s; }
.power-steps .ps.done { color: var(--text); }
.power-steps .ps .b { width: 18px; height: 18px; border: 1.5px solid currentColor; border-radius: 50%; display: grid; place-items: center; flex: none; }
.power-steps .ps.done .b { background: var(--hl); border-color: var(--hl); color: var(--on-hl); }
.power-steps .ps .b .ico { width: 11px; height: 11px; stroke-width: 3; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--t-small); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
textarea.inp, input.inp {
  width: 100%; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 12px 14px; font-family: var(--font-fa); font-size: var(--t-body); line-height: 1.8; resize: vertical;
}
textarea.inp:focus, input.inp:focus { outline: none; border-color: var(--text); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; direction: ltr; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--border-strong); }
input[type=range]::-moz-range-track { height: 2px; background: var(--border-strong); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--hl); border-radius: 1px; margin-top: -7px; border: 0; }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--hl); border-radius: 1px; border: 0; }

/* ---------- overview ---------- */
.hello { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.hello h2 { margin: 6px 0 8px; font-size: var(--t-h2); font-weight: 800; line-height: 1.35; text-wrap: balance; }
.hello p { margin: 0; color: var(--muted); max-width: 78ch; font-size: var(--t-lead); line-height: 1.75; }
.hello p b { color: var(--text); font-weight: 700; }

.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; position: relative; }
.pipe-node { position: relative; padding: 0 6px; display: flex; flex-direction: column; gap: 8px; }
.pipe-node .box { border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 12px; min-height: 124px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); position: relative; z-index: 1; }
.pipe-node.core .box { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }
.pipe-node.core .box .label, .pipe-node.core .box .muted { color: var(--on-hl); opacity: .72; }
.pipe-node .box .t { font-weight: 800; font-size: var(--t-small); line-height: 1.45; }
.pipe-node .box .d { font-size: var(--t-label); color: var(--muted); line-height: 1.6; }
.pipe-node .tag { font-size: 10.5px; color: var(--faint); text-align: center; font-family: var(--font-mono); letter-spacing: .06em; }
.pipe-wire { position: absolute; top: 62px; inset-inline: 6%; height: 1px; background: var(--border-strong); z-index: 0; }
.pipe-wire i { position: absolute; top: -3px; width: 7px; height: 7px; background: var(--hl); border-radius: 50%; inset-inline-start: 0; animation: wire 4.8s linear infinite; }
.pipe-wire i:nth-child(2) { animation-delay: -1.6s; }
.pipe-wire i:nth-child(3) { animation-delay: -3.2s; }
@keyframes wire { from { inset-inline-start: 0%; } to { inset-inline-start: 100%; } }

.queue-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); align-items: center; }
.queue-item:last-child { border-bottom: 0; }
.queue-item .q1 { font-size: var(--t-small); font-weight: 700; }
.queue-item .q2 { font-size: var(--t-label); color: var(--muted); }
.queue-item.done { opacity: .45; }

.context { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--border); border-radius: var(--radius); }
.context > div { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
.context > div + div { border-inline-start: 1px solid var(--border); }
.context .disp { font-size: 2rem; }
.context .src { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); direction: ltr; unicode-bidi: isolate; text-align: start; }

.minirow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: var(--t-small); }
.minirow:last-child { border-bottom: 0; }
.minirow .r { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }

/* ---------- P1 order capture ---------- */
.oc { display: grid; grid-template-columns: minmax(0, 3.2fr) minmax(0, 4fr) minmax(0, 5fr); gap: 20px; align-items: start; }
.inbox { display: flex; flex-direction: column; }
.inbox-item {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 11px 10px; text-align: start;
  background: none; border: 1px solid transparent; border-bottom-color: var(--border); border-radius: 0; width: 100%;
  transition: background-color .12s;
}
.inbox-item:hover { background: var(--raised); }
.inbox-item[aria-selected="true"] { border-color: var(--text); border-radius: var(--radius); background: var(--raised); }
.inbox-item .av { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border-strong); display: grid; place-items: center; font-weight: 800; font-size: var(--t-small); }
.inbox-item .l1 { display: flex; gap: 6px; align-items: center; font-size: var(--t-small); font-weight: 700; min-width: 0; }
.inbox-item .l1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.inbox-item .l1 .tm { margin-inline-start: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); font-weight: 400; }
.inbox-item .l2 { font-size: var(--t-label); color: var(--muted); display: flex; gap: 6px; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.inbox-item .st { font-size: 10.5px; }
.inbox-item.new { animation: feedIn .6s var(--ease); }

.chan { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; border: 1px solid var(--border-strong); padding: 0 5px; border-radius: 1px; color: var(--muted); flex: none; }

.viewer { min-height: 420px; }
.bubble { background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; font-size: var(--t-body); line-height: 2; white-space: pre-wrap; position: relative; }
.bubble .mk-q { background: var(--hl); color: var(--on-hl); padding: 1px 4px; border-radius: 1px; transition: background-color .3s; }
.bubble .mk-p { outline: 1.5px solid var(--text); outline-offset: 1px; border-radius: 1px; padding: 0 2px; }
.bubble .mk-t, .mk-t { border-bottom: 2px dashed var(--text); padding: 0 2px; }
.bubble .mk-c { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 6px; }
.bubble .mk-u { outline: 1.5px dashed var(--muted); outline-offset: 1px; padding: 0 2px; }

.voice { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius); }
.voice .play { width: 36px; height: 36px; border-radius: 50%; background: var(--hl); color: var(--on-hl); display: grid; place-items: center; border: 0; flex: none; }
.voice .wave { flex: 1; height: 36px; display: flex; align-items: center; gap: 2px; direction: ltr; }
.voice .wave i { flex: 1; background: var(--s4); border-radius: 1px; min-height: 3px; transition: background-color .1s; }
.voice .wave i.on { background: var(--s1); }
.voice .dur { font-family: var(--font-mono); font-size: var(--t-label); color: var(--muted); }

.paper {
  direction: rtl;
  position: relative; background: #EDEDED; color: #0B0B0F; border-radius: 1px; padding: 22px 26px 18px;
  transform: rotate(-1.2deg); margin: 6px 4px;
  background-image: repeating-linear-gradient(0deg, transparent 0 33px, #C9C9CE 33px 34px);
  font-family: var(--font-fa); font-weight: 300; font-size: 1.12rem; line-height: 34px; overflow: hidden;
}
.paper .row { display: flex; justify-content: space-between; gap: 16px; position: relative; }
.paper .row span { font-style: italic; }
.paper .bx { position: absolute; inset: 3px -6px; border: 1.5px solid #0B0B0F; opacity: 0; transition: opacity .25s; }
.paper .row.hit .bx { opacity: 1; }
.paper .row .cf { position: absolute; inset-inline-start: -6px; top: -12px; font-family: var(--font-mono); font-size: 9px; line-height: 1; background: #0B0B0F; color: #EDEDED; padding: 2px 4px; font-style: normal; opacity: 0; transition: opacity .25s; }
.paper .row.hit .cf { opacity: 1; }
.paper .scan { position: absolute; inset-inline: 0; height: 2px; background: #0B0B0F; top: 0; opacity: 0; }
.paper.scanning .scan { opacity: 1; animation: scan 1.8s linear; }
@keyframes scan { from { top: 0; } to { top: 100%; } }
.paper .hd { font-weight: 700; font-style: normal; margin-bottom: 4px; }

.xls { width: 100%; border-collapse: collapse; font-size: var(--t-label); direction: ltr; }
.xls td, .xls th { border: 1px solid var(--border-strong); padding: 5px 8px; font-family: var(--font-mono); text-align: left; }
.xls th { background: var(--raised); color: var(--muted); font-weight: 500; }
.xls td.fa { font-family: var(--font-fa); direction: rtl; text-align: right; }

.proc { display: flex; flex-direction: column; gap: 6px; }
.proc .ps { display: flex; align-items: center; gap: 10px; font-size: var(--t-small); color: var(--faint); transition: color .25s; }
.proc .ps.done { color: var(--text); }
.proc .ps.run { color: var(--text); }
.proc .ps .b { width: 16px; height: 16px; border: 1.5px solid currentColor; border-radius: 50%; display: grid; place-items: center; flex: none; }
.proc .ps.done .b { background: var(--hl); border-color: var(--hl); color: var(--on-hl); }
.proc .ps.run .b { border-style: dashed; animation: spin 1.2s linear infinite; }
.proc .ps .b .ico { width: 10px; height: 10px; stroke-width: 3; }
.proc .ps .tm { margin-inline-start: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
@keyframes spin { to { transform: rotate(360deg); } }

.draft .lines .ln { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: center; animation: feedIn .4s var(--ease); }
.draft .lines .ln .nm { font-size: var(--t-small); font-weight: 700; line-height: 1.4; }
.draft .lines .ln .cd { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); }
.draft .lines .ln .q { font-size: var(--t-small); text-align: end; white-space: nowrap; }
.draft .lines .ln .pr { font-family: var(--font-mono); font-size: var(--t-small); text-align: end; min-width: 92px; direction: ltr; }
.draft .lines .ln .conf { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: var(--t-label); color: var(--muted); }
.draft .lines .ln .conf .meter { flex: 1; max-width: 160px; height: 4px; }
.draft .lines .ln.unk .nm { color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-small); line-height: 1.55; }
.check .b { width: 18px; height: 18px; border-radius: 1px; display: grid; place-items: center; flex: none; margin-top: 2px; border: 1.5px solid var(--text); }
.check.ok .b { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }
.check.bad .b { border-style: solid; }
.check .b .ico { width: 11px; height: 11px; stroke-width: 3; }
.total { display: flex; align-items: baseline; gap: 10px; padding-top: 4px; }
.total .disp { font-size: 1.9rem; }
.verdict { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); font-size: var(--t-small); font-weight: 700; }
.verdict.ok { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }
.verdict.review { border-color: var(--text); }
.verdict.review::before { content: ""; align-self: stretch; width: 10px; flex: none; margin-block: -4px; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 4px); }
.reply { border-inline-start: 2px solid var(--text); padding: 6px 12px; font-size: var(--t-small); line-height: 1.8; color: var(--muted); }
.reply b { color: var(--text); }

.try { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 20px; }

/* ---------- P2 ---------- */
.risk-score { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.risk-score .meter { flex: 1; height: 5px; }
.risk-score .n { font-size: var(--t-small); width: 26px; text-align: end; }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 140px 40px; gap: 10px; align-items: center; font-size: var(--t-small); padding: 6px 0; }
.factor .fb { height: 10px; position: relative; direction: ltr; }
.factor .fb::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--border-strong); }
.factor .fb i { position: absolute; top: 0; bottom: 0; display: block; }
.factor .fb i.pos { left: 50%; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 4px); outline: 1px solid var(--text); outline-offset: -1px; }
.factor .fb i.neg { right: 50%; background: var(--s3); }
.factor .v { font-family: var(--font-mono); font-size: var(--t-label); direction: ltr; text-align: end; }
.calc-out { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.calc-out .disp { font-size: 3rem; }
.ab { display: flex; flex-direction: column; gap: 12px; }
.ab .row { display: grid; grid-template-columns: 110px 1fr 70px; gap: 12px; align-items: center; font-size: var(--t-small); }
.ab .bar { height: 22px; background: var(--s1); border-radius: 1px; }
.ab .bar.ctl { background: var(--s4); }
.msg-preview { background: var(--raised); border: 1px solid var(--border); padding: 12px 14px; border-radius: var(--radius); font-size: var(--t-small); line-height: 1.9; }

/* ---------- P3 ---------- */
.fx { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.fx .big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.fx .big .disp { font-size: 2.4rem; }
.terms { display: flex; flex-direction: column; }
.terms > div { display: grid; grid-template-columns: 110px 1fr 84px; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: var(--t-small); }
.terms > div:last-child { border-bottom: 0; }
.terms > div .disp { font-size: 1.15rem; text-align: end; }
.pricelist { background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.pricelist .ph { display: flex; align-items: center; gap: 12px; }
.pricelist .ph svg { width: 76px; height: auto; }
.pricelist .ph svg { fill: var(--text); }
.up { font-family: var(--font-mono); font-size: var(--t-label); direction: ltr; white-space: nowrap; }

/* ---------- P4 phone ---------- */
.phone-wrap { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 24px; align-items: start; }
.phone { border: 1px solid var(--border-strong); border-radius: 26px; padding: 10px; background: var(--bg); }
.phone .scr { border-radius: 18px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; height: 640px; background: var(--surface); }
.phone .bar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
.phone .bar .av { width: 36px; height: 36px; border-radius: 50%; background: var(--hl); display: grid; place-items: center; flex: none; }
.phone .bar .av svg { width: 20px; height: 20px; }
.phone .bar .av svg { fill: var(--on-hl); }
.phone .bar .nm { font-weight: 800; font-size: var(--t-small); }
.phone .bar .s { font-size: var(--t-label); color: var(--muted); }
.phone .msgs { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
.tg { background: var(--bg); border: 1px solid var(--border); border-radius: 12px 12px 12px 2px; padding: 10px 12px; font-size: var(--t-small); line-height: 1.85; max-width: 94%; align-self: flex-start; animation: feedIn .4s var(--ease); border-radius: 12px; border-start-start-radius: 2px; }
.tg.me { align-self: flex-end; background: var(--hl); color: var(--on-hl); border-color: var(--hl); border-radius: 12px; border-start-end-radius: 2px; }
.tg .tm { display: block; text-align: start; font-family: var(--font-mono); font-size: 10px; color: var(--faint); margin-top: 4px; direction: ltr; }
.tg .kv { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--border); padding: 3px 0; }
.tg .kv:last-of-type { border-bottom: 0; }
.tg .h { font-weight: 800; margin-bottom: 4px; }
.tg .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.tg .btns span { border: 1px solid var(--border-strong); border-radius: 6px; text-align: center; font-size: var(--t-label); padding: 5px; }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; align-self: flex-start; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.metric-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.metric-chips .mc { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--border); padding: 2px 7px; border-radius: 1px; color: var(--muted); direction: ltr; transition: all .2s; }
.metric-chips .mc.hit { background: var(--hl); color: var(--on-hl); border-color: var(--hl); }
.qa-out { border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 180px; }
.trace { font-family: var(--font-mono); font-size: var(--t-label); color: var(--muted); direction: ltr; text-align: left; background: var(--bg); border: 1px solid var(--border); padding: 8px 10px; border-radius: var(--radius); line-height: 1.7; white-space: pre-wrap; }

/* ---------- P5/P6/P9 charts ---------- */
svg { direction: ltr; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.chart text.fa { font-family: var(--font-fa); }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: var(--t-label); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 0; border-top: 2px solid var(--s1); display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.legend i.dot2 { border-top-style: dotted; border-top-width: 3px; }
.legend i.box { height: 10px; width: 14px; border: 0; background: var(--s3); }
.legend i.box.s1 { background: var(--s1); }
.legend i.box.s4 { background: var(--s4); }
.legend i.box.ht { background: none; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1.5px, transparent 1.5px 4px); outline: 1px solid var(--text); outline-offset: -1px; }

.mapbox { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: auto; }

.gantt { display: flex; flex-direction: column; gap: 0; direction: ltr; }
.gantt .gr { display: grid; grid-template-columns: 1fr 150px; align-items: center; border-bottom: 1px solid var(--border); min-height: 54px; }
.gantt .gl { direction: rtl; padding: 6px 12px; font-size: var(--t-small); font-weight: 700; line-height: 1.35; }
.gantt .gl .s { display: block; font-weight: 400; font-size: var(--t-label); color: var(--muted); }
.gantt .track { position: relative; height: 54px; }
.gantt .job {
  position: absolute; top: 11px; height: 32px; border-radius: 1px; background: var(--s2); color: var(--on-hl);
  font-size: 10.5px; font-family: var(--font-mono); display: flex; align-items: center; justify-content: center; overflow: hidden;
  transition: left .8s var(--ease), width .8s var(--ease), background-color .3s; white-space: nowrap; padding: 0 4px;
}
.gantt .job.heavy { background: var(--s1); }
.gantt .job.light { background: var(--s3); }
.gantt .job.gen { background: transparent; border: 1.5px dashed var(--text); color: var(--text); }
.gantt .job.hit { outline: 2px solid var(--text); outline-offset: 2px; }
.gantt .job.hit::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 7px; background: var(--bg); background-image: repeating-linear-gradient(111.8deg, var(--text) 0 1.5px, transparent 1.5px 4px); }
.gantt .out { position: absolute; top: 0; bottom: 0; background-image: repeating-linear-gradient(111.8deg, var(--hatch) 0 1px, transparent 1px 7px); opacity: .55; border-inline: 1px solid var(--text); transition: opacity .3s; }
.gantt .out.new { animation: pulse 1s 3; }
.gantt .axis { display: grid; grid-template-columns: 1fr 150px; }
.gantt .axis .ticks { position: relative; height: 22px; }
.gantt .axis .ticks span { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); top: 4px; }
html[lang="en"] .gantt .gr, html[lang="en"] .gantt .axis { grid-template-columns: 150px 1fr; }
html[lang="en"] .gantt .gl { order: -1; direction: ltr; }
html[lang="en"] .gantt .axis > div:last-child { order: -1; }
.notice { background: var(--raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-size: var(--t-small); line-height: 1.9; position: relative; }
.notice .ext { background: var(--hl); color: var(--on-hl); padding: 0 4px; border-radius: 1px; }

/* ---------- P7 ---------- */
.chat { display: flex; flex-direction: column; gap: 12px; min-height: 360px; }
.ans { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; font-size: var(--t-small); line-height: 1.95; animation: feedIn .4s var(--ease); }
.ans .src { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ans .src span { font-family: var(--font-mono); font-size: 10.5px; border: 1px solid var(--border-strong); padding: 1px 6px; border-radius: 1px; direction: ltr; }
.ask { align-self: flex-start; background: var(--hl); color: var(--on-hl); padding: 8px 14px; border-radius: var(--radius); font-size: var(--t-small); font-weight: 600; animation: feedIn .3s var(--ease); max-width: 90%; }
.wo { display: grid; grid-template-columns: 110px 1fr; gap: 0; font-size: var(--t-small); border: 1px solid var(--border); border-radius: var(--radius); }
.wo > div { padding: 8px 12px; border-bottom: 1px solid var(--border); line-height: 1.6; }
.wo > div:nth-last-child(-n+2) { border-bottom: 0; }
.wo > div:nth-child(odd) { color: var(--muted); border-inline-end: 1px solid var(--border); }
.wo .fill { animation: feedIn .35s var(--ease) both; }

/* ---------- P11 ---------- */
.line-cam { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.line-cam canvas { display: block; width: 100%; height: 340px; }
.line-cam .hud { position: absolute; inset-block-start: 12px; inset-inline-start: 12px; display: flex; gap: 8px; }
.crop { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); aspect-ratio: 4 / 3; position: relative; display: grid; place-items: center; max-width: 100%; }
.crop canvas { width: 100%; height: 100%; display: block; }

/* ---------- about ---------- */
.manifesto { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; align-items: stretch; }
.manifesto h2 { font-size: clamp(1.9rem, 3.2vw, 3.1rem); font-weight: 800; line-height: 1.35; margin: 10px 0 14px; text-wrap: balance; }
.manifesto p { color: var(--muted); font-size: var(--t-lead); line-height: 1.85; margin: 0; max-width: 62ch; }
.manifesto .art { border: 1px solid var(--border); border-radius: var(--radius); position: relative; min-height: 280px; display: grid; place-items: center; overflow: hidden; }
.manifesto .art svg { width: 46%; max-width: 220px; position: relative; }
.manifesto .art svg { fill: var(--text); }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border: 1px solid var(--border); border-radius: var(--radius); }
.rules > div { padding: 20px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.rules > div:nth-child(3n+2), .rules > div:nth-child(3n+3) { border-inline-start: 1px solid var(--border); }
.rules > div:nth-last-child(-n+3) { border-bottom: 0; }
.rules h3 { margin: 0; font-size: 1rem; font-weight: 800; }
.rules p { margin: 0; font-size: var(--t-small); color: var(--muted); line-height: 1.85; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.steps > div { padding: 16px 16px 16px 12px; border-top: 2px solid var(--border-strong); display: flex; flex-direction: column; gap: 6px; position: relative; }
.steps > div::before { content: ""; position: absolute; top: -6px; inset-inline-start: 0; width: 10px; height: 10px; background: var(--hl); }
.steps > div.last::before { background: transparent; border: 2px solid var(--text); }

function seeded(seed) { // mulberry32
  let a = seed >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

const S = { lang: 'fa' };
const EN = () => S.lang === 'en';
const T = (fa, en) => (EN() ? en : fa);                 // pick a string for the current language
const L = (x) => (Array.isArray(x) ? T(x[0], x[1]) : x); // resolve a [fa, en] pair

const fmt = (n, d = 0) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

  if (Math.abs(t) >= 1e9) return `${N(fmt(t / 1e9, 2))} ${T('میلیارد', 'billion')}${unit}`;
  if (Math.abs(t) >= 1e6) return `${N(fmt(t / 1e6, 1))} ${T('میلیون', 'million')}${unit}`;

}
function moneyFa(t) { // prose style
  if (Math.abs(t) >= 1e9) return T(`${fa(t / 1e9, 1)} میلیارد تومان`, `${trim0(fmt(t / 1e9, 1))} billion toman`);
  if (Math.abs(t) >= 1e6) return T(`${fa(t / 1e6, 1)} میلیون تومان`, `${trim0(fmt(t / 1e6, 1))} million toman`);

/* dates: Jalali in Persian, Gregorian in English */
const _jNum = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' });
const _jLong = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const _jDM = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long' });

const _jMon = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { month: 'long' });
const _eLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

/* pricing model shared by P3, P4, overview */
function replCost(s) {
  const fxEff = S.fxRef === 'open' ? S.fx : FX_OFFICIAL;
  return s.local * Math.pow(1 + S.inflM / 100, S.monthsSince) + s.usd * fxEff;
}
function marginOf(s) { return s.price / replCost(s) - 1; }
function recPrice(s) { return ceil10k(replCost(s) * (1 + S.targetMargin)); }
function belowCount() { return CATALOG.filter((s) => marginOf(s) < 0).length; }

/* ---------------- tooltip & toast ---------------- */
const tipEl = () => $('#tip');
function showTip(html, x, y) {
  const t = tipEl(); t.innerHTML = html; t.classList.add('on');
  const r = t.getBoundingClientRect();
  let left = x + 14, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  t.style.left = Math.max(8, left) + 'px'; t.style.top = Math.max(8, top) + 'px';
}
function hideTip() { tipEl().classList.remove('on'); }
function bindTips(root) {
  $$('[data-tip]', root).forEach((el) => {
    el.addEventListener('pointermove', (e) => showTip(el.getAttribute('data-tip'), e.clientX, e.clientY));
    el.addEventListener('pointerleave', hideTip);
  });
}
function toast(msg, ic = 'check') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `${icon(ic)}<span>${msg}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; }, 3600);
  setTimeout(() => t.remove(), 4000);
}

/* ---------------- tiny SVG chart kit ---------------- */
function sparkline(vals, w = 96, h = 28, opts = {}) {
  const min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => [i * (w - 4) / (vals.length - 1) + 2, h - 3 - (v - min) / span * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const area = `${d} L${last[0].toFixed(1)} ${h} L2 ${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="direction:ltr">
    <path d="${area}" style="fill:var(--s1);opacity:.08"></path>
    <path d="${d}" style="fill:none;stroke:var(--s${opts.s || 1});stroke-width:1.6"></path>
    <rect x="${last[0] - 2.5}" y="${last[1] - 2.5}" width="5" height="5" style="fill:var(--s1)"></rect></svg>`;
}

/* ---------------- exhibition tour ---------------- */
const TOUR = ['overview', 'orders', 'cheques', 'pricing', 'report', 'forecast', 'routes', 'maintenance', 'outage', 'vision', 'about'];
const TOUR_MS = 17000;
let tourIdx = 0, tourTimer = null, tourStart = 0, tourRaf = null;
function startTour(auto = false) {
  S.tour = true;
  renderTourBtn();
  let bar = $('#tourbar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'tourbar'; bar.className = 'tourbar';
    document.body.appendChild(bar);
  }
  tourIdx = Math.max(0, TOUR.indexOf(S.view));
  if (auto) tourIdx = 0;
  tourStep();
}
function tourStep(sameStep = false) {
  const id = TOUR[tourIdx % TOUR.length];
  go(id, { tour: true });
  const v = VIEWS[id];
  const bar = $('#tourbar');
  bar.innerHTML = `<span class="code">${v.code} · ${fa((tourIdx % TOUR.length) + 1)}/${fa(TOUR.length)}</span>
    <span class="cap">${L(v.tourCap) || L(v.title)}</span>
    <span class="prog"><i id="tourProg"></i></span>
    <button class="btn sm" id="tourNext">${T('بعدی', 'Next')}</button><button class="btn sm" id="tourStop">${T('توقف', 'Stop')}</button>`;
  $('#tourNext').addEventListener('click', (e) => { e.stopPropagation(); clearTimeout(tourTimer); tourIdx++; tourStep(); });
  $('#tourStop').addEventListener('click', (e) => { e.stopPropagation(); stopTour(); });
  if (!sameStep) tourStart = performance.now();
  cancelAnimationFrame(tourRaf);
  const p = () => { const el = $('#tourProg'); if (!el) return; el.style.width = Math.min(100, (performance.now() - tourStart) / TOUR_MS * 100) + '%'; tourRaf = requestAnimationFrame(p); };
  p();
  clearTimeout(tourTimer);
  tourTimer = setTimeout(() => { tourIdx++; tourStep(); }, Math.max(1500, TOUR_MS - (performance.now() - tourStart)));
}
function stopTour() {
  if (!S.tour) return;
  S.tour = false;
  clearTimeout(tourTimer); cancelAnimationFrame(tourRaf);
  const bar = $('#tourbar'); if (bar) bar.remove();
  renderTourBtn();
}

/* idle → auto tour after 3 minutes without interaction (booth screen) */
let idleTimer = null;
function resetIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!S.tour && !powerBusy) { startTour(true); toast(T('حالت نمایشگاه خودکار شروع شد · برای توقف هر جای صفحه را لمس کنید', 'Exhibition mode started automatically · touch anywhere to stop'), 'play'); } }, 180000);
}

/* ---------------- boot ---------------- */
function boot() {
  setLang(store.get('auler-lang') || 'fa', false);
  let t = store.get('auler-theme');
  if (!t) t = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  setTheme(t);
  seedFeed();
  renderTopbar();
  renderNav();
  renderStatus();
  tickClock(); setInterval(tickClock, 1000);
  $('#themeBtn').addEventListener('click', () => setTheme(currentTheme() === 'light' ? 'dark' : 'light'));
  $('#langBtn').addEventListener('click', (e) => { e.stopPropagation(); setLang(EN() ? 'fa' : 'en'); });
  $('#fsBtn').addEventListener('click', () => {
    const fail = () => toast(T('تمام‌صفحه در این نما در دسترس نیست', 'Full screen is not available in this view'), 'expand');
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(fail); else document.exitFullscreen(); }
    catch (e) { fail(); }
  });
  $('#tourBtn').addEventListener('click', (e) => { e.stopPropagation(); S.tour ? stopTour() : startTour(); });
  // any real interaction stops the tour (except the tour and language controls)
  ['pointerdown', 'keydown', 'wheel'].forEach((ev) => document.addEventListener(ev, (e) => {
    resetIdle();
    if (!S.tour) return;
    if (e.target.closest && (e.target.closest('#tourbar') || e.target.closest('#tourBtn') || e.target.closest('#langBtn'))) return;
    if (e.isTrusted) stopTour();
  }, { passive: true }));
  // presenter keys: 0–9 jump to modules, P = power drill, L = language
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea')) return;
    const order = ['overview', 'orders', 'cheques', 'pricing', 'report', 'forecast', 'routes', 'maintenance', 'outage', 'vision'];
    if (/^[0-9]$/.test(e.key)) go(order[+e.key]);
    if (e.key === 'p' || e.key === 'P') powerCut();
    if (e.key === 'l' || e.key === 'L') setLang(EN() ? 'fa' : 'en');
  });
  let start = 'overview';
  try { const h = location.hash.replace('#', ''); if (VIEWS[h]) start = h; } catch (e) { /* no hash */ }
  go(start);
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (VIEWS[h] && h !== S.view) go(h); });
  simTimer = setTimeout(simLoop, 3000);
  resetIdle();
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* not available */ }
}

      : { ok: false, fin: true, t: T(`سقف اعتبار: این سفارش مانده را به ${moneyFa(after)} می‌رساند؛ سقف ${moneyFa(c.limit)} است`, `Credit: this order takes the balance to ${moneyFa(after)}; the limit is ${moneyFa(c.limit)}`) });
    if (r.terms && r.terms.type === 'cheque') checks.push(r.terms.days <= c.maxDays
      ? { ok: true, t: T(`مدت چک ${fa(r.terms.days)} روز · در محدوده مجاز این مشتری`, `${r.terms.days}-day cheque · within this customer’s limit`) }
      : { ok: false, fin: true, t: T(`مدت چک ${fa(r.terms.days)} روز؛ سقف مجاز این مشتری ${fa(c.maxDays)} روز است`, `${r.terms.days}-day cheque; this customer’s limit is ${c.maxDays} days`) });
    if (c.score >= 60) checks.push({ ok: false, fin: true, t: T(`امتیاز ریسک چک این مشتری ${fa(c.score)} است (میز ریسک چک)`, `This customer’s cheque risk score is ${c.score} (cheque-risk desk)`) });
  } else checks.push({ ok: false, t: T('مشتری شناسایی نشد · انتخاب دستی لازم است', 'Customer not identified · pick one manually') });
  const lowStock = r.lines.filter((l) => l.qty > l.sku.stock);
  checks.push(lowStock.length ? { ok: false, t: T(`موجودی ناکافی: ${lowStock.map((l) => skuShort(l.sku)).join('، ')}`, `Not enough stock: ${lowStock.map((l) => skuShort(l.sku)).join(', ')}`) } : { ok: true, t: T('موجودی انبار برای همه اقلام کافی است', 'Enough stock for every line') });
  if (r.unknown.length) checks.push({ ok: false, t: T(`${fa(r.unknown.length)} قلم در فهرست کالا پیدا نشد · به صف بررسی رفت`, `${r.unknown.length} item(s) not in the product list · sent to review`) });
  r.checks = checks;
  const lowConf = r.lines.filter((l) => l.conf < .9).length;

}

function highlight(text, r) {
  const marks = [];
  r.lines.forEach((l) => { if (l.span) marks.push({ s: l.span.s, e: l.span.e, c: 'mk-p' }); if (l.qspan) marks.push({ s: l.qspan.s, e: l.qspan.e, c: 'mk-q' }); });
  r.unknown.forEach((u) => marks.push({ s: u.span.s, e: u.span.e, c: 'mk-u' }));
  if (r.terms && r.terms.s != null) marks.push({ s: r.terms.s, e: r.terms.e, c: 'mk-t' });
  if (r.delivery && r.delivery.s != null) marks.push({ s: r.delivery.s, e: r.delivery.e, c: 'mk-t' });
  if (r.customer && r.customer.span) marks.push({ s: r.customer.span.s, e: r.customer.span.e, c: 'mk-c' });
  marks.sort((a, b) => a.s - b.s);
  let out = '', pos = 0;
  marks.forEach((mk) => { if (mk.s < pos) return; out += esc(text.slice(pos, mk.s)) + `<span class="${mk.c}">${esc(text.slice(mk.s, mk.e))}</span>`; pos = mk.e; });
  return out + esc(text.slice(pos));
}

function cashChart() {
  const filler = [420, 510, 380, 610, 450, 530, 390, 470].map((v) => v * 1e6);

  const bw = (W - pl - pr) / 8;
  const y = (v) => H - pb - v / top * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = top / 4 * k; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"></line><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v / 1e6)}</text>`; }

function erosionChart(m, days) {

  [0, 60, 120, 180].forEach((k) => { g += `<text x="${x(k)}" y="${H - 6}" text-anchor="middle">${k}d</text>`; });

function marginChart() {
  const W = 640, rowH = 28, pt = 20, H = pt + CATALOG.length * rowH + 22;
  const labelW = 110;
  const x0 = EN() ? labelW + 8 : 10, x1 = EN() ? W - 10 : W - labelW - 8;
  const lo = -.08, hi = .22;
  const x = (v) => x0 + (clamp(v, lo, hi) - lo) / (hi - lo) * (x1 - x0);
  let g = '';
  [-.05, 0, .1, .2].forEach((v) => { g += `<line x1="${x(v)}" x2="${x(v)}" y1="${pt - 4}" y2="${H - 20}" style="stroke:${v === 0 ? 'var(--s3)' : 'var(--grid)'}"></line><text x="${x(v)}" y="${H - 6}" text-anchor="middle">${Math.round(v * 100)}%</text>`; });
  g += `<line x1="${x(S.targetMargin)}" x2="${x(S.targetMargin)}" y1="${pt - 4}" y2="${H - 20}" style="stroke:var(--s1);stroke-dasharray:4 3"></line><text x="${x(S.targetMargin)}" y="${pt - 7}" text-anchor="middle">TARGET ${Math.round(S.targetMargin * 100)}%</text>`;
  CATALOG.forEach((s, i) => {
    const m = marginOf(s), y = pt + i * rowH + 5, h = rowH - 10;
    const a = x(Math.min(0, m)), b = x(Math.max(0, m));
    g += `<rect x="${a}" y="${y}" width="${Math.max(1.5, b - a)}" height="${h}" style="${m < 0 ? 'fill:url(#hatch);stroke:var(--s1);stroke-width:1.2' : m < S.targetMargin / 2 ? 'fill:var(--s3)' : 'fill:var(--s1)'}"></rect>`;
    g += EN() ? `<text x="4" y="${y + h - 3}" text-anchor="start" style="font-size:12px;fill:var(--text)">${s.enShort}</text>` : `<text class="fa" x="${W - 4}" y="${y + h - 3}" text-anchor="end" style="font-size:12px;fill:var(--text)">${s.short}</text>`;
    g += `<rect x="0" y="${y - 4}" width="${W}" height="${rowH}" style="fill:transparent" data-tip="<div class='tt'>${skuName(s)}</div>${T('حاشیه با قیمت جایگزینی', 'Margin at replacement cost')}: ${(m * 100).toFixed(1)}%<br>${T('قیمت فعلی', 'Current price')}: ${moneyFa(s.price)}<br>${T('قیمت جایگزینی', 'Replacement cost')}: ${moneyFa(replCost(s))}"></rect>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('حاشیه سود هر قلم با قیمت جایگزینی', 'Margin per SKU at replacement cost')}">${g}</svg>`;
}
const statusPill = (m) => m < 0 ? `<span class="pill risk">${icon('alert')}${T('زیر قیمت جایگزینی', 'Below replacement cost')}</span>` : m < S.targetMargin / 2 ? `<span class="pill warn">${T('حاشیه ناکافی', 'Thin margin')}</span>` : `<span class="pill">${T('سالم', 'Healthy')}</span>`;

      </div>`;
      wrap.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
      $('#plNo', wrap).addEventListener('click', () => { wrap.innerHTML = ''; });
      $('#plOk', wrap).addEventListener('click', () => {
        CATALOG.forEach((s) => { s.local = s.local * Math.pow(1 + S.inflM / 100, S.monthsSince); s.price = recPrice(s); });
        S.monthsSince = 0; S.priceApproved = true;
        if (S.approvals) { const a = S.approvals.find((x) => x.id === 'a2'); if (a) a.done = true; }
        wrap.innerHTML = '';
        draw();
        toast(T(`لیست قیمت جدید تأیید و منتشر شد · ${fa(ch.length)} قلم به‌روز شد`, `New price list approved and published · ${ch.length} SKUs updated`));
        pushFeed({ ic: 'tag', t: [`لیست قیمت جدید با دلار ${S.fx.toLocaleString('fa-IR')} تومان تأیید و برای ویزیتورها ارسال شد`, `New price list at ${fmt(S.fx)} toman per dollar approved and sent to sales reps`], m: ['P3 · لیست قیمت', 'P3 · Price list'] });
      });
    });
    draw();
    // tour: sweep the dollar so the table visibly reacts
    let sweep = null; const sweepTo = S.fx;
    if (opts && opts.tour && !REDUCED) {
      const from = 172000; let t0 = null;
      S.fx = from; fxR.value = from; draw();
      const step = (ts) => { if (!t0) t0 = ts; const p = Math.min(1, (ts - t0) / 5000); S.fx = Math.round((from + (sweepTo - from) * p) / 1000) * 1000; fxR.value = S.fx; draw(); if (p < 1) sweep = requestAnimationFrame(step); else sweep = null; };
      setTimeout(() => { sweep = requestAnimationFrame(step); }, 1200);
    }
    return () => { cancelAnimationFrame(raf); if (opts && opts.tour) { cancelAnimationFrame(sweep); S.fx = sweepTo; } };
  }
});

function matchQA(q) {
  const t = normFa(q);
  if (/منطقه|شهر|استان|region|city|area/.test(t)) return 'region';
  if (/بدهی|بدهکار|معوق|سررسید|طلب|debt|overdue|owe|receivable/.test(t)) return 'debt';
  if (/حاشیه|سود|قیمت جایگزینی|margin|profit|replacement/.test(t)) return 'margin';
  if (/موجودی|انبار|کسری|تمام|stock|inventory|warehouse|run out/.test(t)) return 'stock';
  if (/فروش|sales|sold/.test(t)) return 'region';
  return null;
}

const FC_SKUS = [
  { code: 'P-101', base: 2050, trend: 6, amp: .3, seed: 3 },
  { code: 'P-301', base: 4100, trend: 10, amp: .18, seed: 7 },
  { code: 'P-601', base: 1150, trend: 2, amp: .42, seed: 11 }
];
function fcData(cfg) {
  const r = seeded(cfg.seed);
  const H = 24, F = 3, pts = [];
  for (let i = 0; i < H + F; i++) {
    const d = addDays(TODAY, (i - (H - 1)) * 30.44);
    const jm = parseInt(jNum(d).split('/')[1], 10);
    const season = jm === 12 ? 1 + cfg.amp : jm === 1 ? 1 - cfg.amp * .6 : jm === 11 ? 1 + cfg.amp * .35 : jm === 6 || jm === 7 ? 1 - cfg.amp * .15 : 1;
    const base = (cfg.base + cfg.trend * i) * season;
    const k = i - (H - 1); // 0 = current month
    let ev = null;
    if (k === -9) ev = 'spike';
    if (k === -8 || k === -7 || k === -6) ev = 'shock';
    let actual = null;
    if (i < H) {
      actual = base * (1 + (r() - .5) * .12);
      if (ev === 'spike') actual *= 1.42;
      if (ev === 'shock') actual *= k === -8 ? .62 : k === -7 ? .7 : .84;
    }
    const fc = base * (k >= -5 ? (k > 0 ? 1 : 1 + (r() - .5) * .05) : 1);
    pts.push({ i, d, label: jMon(d), yy: EN() ? String(d.getFullYear()).slice(2) : jNum(d).slice(2, 4), actual: actual && Math.round(actual), fc: Math.round(fc * .985), lo: Math.round(fc * (1 - .07 - Math.max(0, k) * .035)), hi: Math.round(fc * (1 + .07 + Math.max(0, k) * .035)), planner: Math.round(base * 1.12), ev, k });
  }
  return pts;
}
function fcChart(pts) {
  const W = 760, H = 300, pl = 48, pr = 12, pt = 26, pb = 40;
  const vals = pts.flatMap((p) => [p.actual || 0, p.hi, p.planner]);
  const top = Math.ceil(Math.max(...vals) / 1000) * 1000;
  const x = (i) => pl + i / (pts.length - 1) * (W - pl - pr), y = (v) => H - pb - v / top * (H - pt - pb);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = top / 4 * k; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)"></line><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const shock = pts.filter((p) => p.ev === 'shock');
  if (shock.length) { const a = x(shock[0].i) - 10, b = x(shock[shock.length - 1].i) + 10; g += `<rect x="${a}" y="${pt}" width="${b - a}" height="${H - pt - pb}" style="fill:url(#hatch);opacity:.35"></rect><text class="fa" x="${(a + b) / 2}" y="${H - pb - 8}" text-anchor="middle" style="font-size:10.5px;fill:var(--text)">${T('شوک ۱۴۰۴', '2026 shock')}</text>`; }
  const sp = pts.find((p) => p.ev === 'spike');
  const nowI = pts.find((p) => p.k === 0).i;
  g += `<line x1="${x(nowI)}" x2="${x(nowI)}" y1="${pt}" y2="${H - pb}" style="stroke:var(--s3);stroke-dasharray:2 3"></line><text x="${x(nowI) + 4}" y="${pt + 10}">NOW</text>`;
  const fpts = pts.filter((p) => p.k >= 0);
  g += `<path d="M${fpts.map((p) => x(p.i) + ' ' + y(p.hi)).join(' L')} L${fpts.slice().reverse().map((p) => x(p.i) + ' ' + y(p.lo)).join(' L')} Z" style="fill:var(--s1);opacity:.12"></path>`;
  const pp = pts.filter((p) => p.k >= -5);
  g += `<path d="M${pp.map((p) => x(p.i) + ' ' + y(p.planner)).join(' L')}" style="fill:none;stroke:var(--s3);stroke-width:2;stroke-dasharray:6 4"></path>`;
  const ap = pts.filter((p) => p.actual != null);
  g += `<path d="M${ap.map((p) => x(p.i) + ' ' + y(p.actual)).join(' L')}" style="fill:none;stroke:var(--s1);stroke-width:2"></path>`;
  g += `<path d="M${pp.map((p) => x(p.i) + ' ' + y(p.fc)).join(' L')}" style="fill:none;stroke:var(--s2);stroke-width:2;stroke-dasharray:2 3"></path>`;
  const lastA = ap[ap.length - 1];
  g += `<rect x="${x(lastA.i) - 4}" y="${y(lastA.actual) - 4}" width="8" height="8" style="fill:var(--s1)"></rect>`;
  if (sp) g += `<rect x="${x(sp.i) - 5}" y="${y(sp.actual) - 5}" width="10" height="10" style="fill:var(--bg);stroke:var(--s1);stroke-width:1.5"></rect><text class="fa" x="${x(sp.i)}" y="${y(sp.actual) - 12}" text-anchor="middle" style="font-size:11px;fill:var(--text)">${T('پیش‌خرید قبل از گرانی · تقاضای واقعی نیست', 'Pre-buying before a price rise · not real demand')}</text>`;
  pts.forEach((p, i) => { if (i % 3 === 0 || p.k === 0) g += `<text class="fa" x="${x(p.i)}" y="${H - pb + 16}" text-anchor="middle" style="font-size:10.5px">${p.label}</text><text x="${x(p.i)}" y="${H - pb + 30}" text-anchor="middle" style="font-size:9.5px;fill:var(--faint)">${p.yy}</text>`; });
  g += `<line id="fcX" x1="0" x2="0" y1="${pt}" y2="${H - pb}" style="stroke:var(--s1);opacity:0"></line><rect id="fcHit" x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}" style="fill:transparent"></rect>`;
  return { svg: `<svg class="chart" id="fcSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('فروش ماهانه و پیش‌بینی', 'Monthly sales and forecast')}">${g}<text x="${pl}" y="12" style="font-size:10px">CARTONS / MONTH</text></svg>`, x, W, pl, pr };
}

const STORE_NAMES = [['ستاره', 'Setareh'], ['نگین', 'Negin'], ['آرمان', 'Arman'], ['سحر', 'Sahar'], ['یاس', 'Yas'], ['مهتاب', 'Mahtab'], ['آوا', 'Ava'], ['رز', 'Roz'], ['ارغوان', 'Arghavan'], ['شقایق', 'Shaghayegh'], ['بنفشه', 'Banafsheh'], ['نسیم', 'Nasim'], ['کیان', 'Kian'], ['پرنیان', 'Parnian'], ['سپیده', 'Sepideh'], ['افق', 'Ofogh'], ['باران', 'Baran'], ['دنا', 'Dena'], ['الوند', 'Alvand'], ['زاگرس', 'Zagros']];
const STORE_KIND = [['فروشگاه', 'Store'], ['سوپر', 'Market'], ['هایپر', 'Hyper']];
const WINDOWS = [['۸ تا ۱۲', '08–12'], ['۹ تا ۱۳', '09–13'], ['۱۰ تا ۱۶', '10–16'], ['۱۴ تا ۱۸', '14–18']];
let STOPS = null, ROUTE_PLAN = null;
function buildStops() {
  const r = seeded(42); const out = [];
  DISTRICTS.forEach((d, di) => { for (let k = 0; k < 5; k++) {
    const idx = di * 5 + k;
    const name = idx < CUSTOMERS.length ? [CUSTOMERS[idx].name, CUSTOMERS[idx].en] : [`${STORE_KIND[k % 3][0]} ${STORE_NAMES[idx % 20][0]}`, `${STORE_NAMES[idx % 20][1]} ${STORE_KIND[k % 3][1]}`];
    out.push({ id: idx, x: d.x + (r() - .5) * 120, y: d.y + (r() - .5) * 90, d: di, qty: 5 + Math.round(r() * 10), name, win: WINDOWS[k % 4] });
  } });
  return out;
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const routeLen = (rt) => { let p = MAP.depot, s = 0; rt.forEach((q) => { s += dist(p, q); p = q; }); return s + dist(p, MAP.depot); };
function nn(stops) { const left = stops.slice(), rt = []; let p = MAP.depot; while (left.length) { let bi = 0; left.forEach((q, i) => { if (dist(p, q) < dist(p, left[bi])) bi = i; }); p = left.splice(bi, 1)[0]; rt.push(p); } return rt; }
function twoOpt(rt) {
  let best = rt.slice(), improved = true;
  while (improved) { improved = false; for (let i = 0; i < best.length - 1; i++) for (let k = i + 1; k < best.length; k++) { const c = best.slice(0, i).concat(best.slice(i, k + 1).reverse(), best.slice(k + 1)); if (routeLen(c) < routeLen(best) - .01) { best = c; improved = true; } } }
  return best;
}
function planRoutes() {
  if (!STOPS) STOPS = buildStops();
  // dispatcher: 4 vans on fixed district groups, nearest-next stop
  const groups = [[0, 1], [2], [3, 4], [5]];
  const manual = groups.map((g) => nn(STOPS.filter((s) => g.includes(s.d))));
  // AULER: 3 vans, angular sweep around the depot (best of all start angles), nearest neighbour + 2-opt
  const ang = STOPS.map((s) => ({ s, a: Math.atan2(s.y - MAP.depot.y, s.x - MAP.depot.x) })).sort((a, b) => a.a - b.a).map((o) => o.s);
  let opt = null, bestL = Infinity;
  for (let st = 0; st < ang.length; st++) {
    const ord = ang.slice(st).concat(ang.slice(0, st));
    const rs = [ord.slice(0, 10), ord.slice(10, 20), ord.slice(20)].map((g) => twoOpt(nn(g)));
    const Ls = rs.reduce((a, x) => a + routeLen(x), 0);
    if (Ls < bestL) { bestL = Ls; opt = rs; }
  }
  return { manual, opt };
}

/* =====================================================================
   P9 · OUTAGE-AWARE PRODUCTION SCHEDULER
   ===================================================================== */
const DAY0 = 6 * 60, DAYLEN = 16 * 60; // 06:00 → 22:00
const LINES = [
  { id: 'cook', n: ['پخت و استریل', 'Cooking & sterilising'], s: ['پرمصرف · ۲۴۰ kW', 'Heavy · 240 kW'], cls: 'heavy', kw: 240, jobs: [120, 120, 120, 120], tag: 'B', manual: [0, 180, 420, 600] },
  { id: 'fill', n: ['پرکنی', 'Filling'], s: ['متوسط · ۱۲۰ kW', 'Medium · 120 kW'], cls: '', kw: 120, jobs: [210, 180, 240], tag: 'F', manual: [60, 300, 540] },
  { id: 'pack', n: ['بسته‌بندی', 'Packing'], s: ['کم‌مصرف · ۴۵ kW', 'Light · 45 kW'], cls: 'light', kw: 45, jobs: [240, 240, 180], tag: 'K', manual: [120, 420, 720], genOK: true },
  { id: 'cold', n: ['سردخانه و کمپرسور', 'Cold storage & compressor'], s: ['پیوسته · ۶۰ kW', 'Continuous · 60 kW'], cls: 'light', kw: 60, cont: true }
];
const tm = (m) => { const t = DAY0 + m; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
const inter = (a, b) => Math.max(0, Math.min(a.e, b.e) - Math.max(a.s, b.s));
function schedule(outs, mode) {
  const res = {};
  LINES.forEach((Ln) => {
    if (Ln.cont) { res[Ln.id] = [{ s: 0, e: DAYLEN, gen: false }].concat(outs.map((o) => ({ s: o.s, e: o.e, gen: true }))); return; }
    if (mode === 'manual') { res[Ln.id] = Ln.jobs.map((d, i) => ({ s: Ln.manual[i], e: Ln.manual[i] + d, k: i })); return; }
    let cur = 0; const out = [];
    Ln.jobs.forEach((d, i) => {
      let s = cur, placed = false;
      while (s + d <= DAYLEN) {
        const blk = { s, e: s + d };
        const hit = outs.find((o) => inter(blk, o) > 0);
        if (!hit || Ln.genOK) { out.push({ s, e: s + d, k: i, gen: !!hit && Ln.genOK }); cur = s + d; placed = true; break; }
        s = hit.e;
      }
      if (!placed) out.push({ s: null, e: null, k: i, deferred: true, d });
    });
    res[Ln.id] = out;
  });
  return res;
}
function evalPlan(plan, outs, mode) {
  let prod = 0, restarts = 0, packGen = 0, deferred = 0;
  LINES.forEach((Ln) => {
    if (Ln.cont) return;
    plan[Ln.id].forEach((j) => {
      if (j.deferred) { deferred++; return; }
      const blk = { s: j.s, e: j.e }, lost = outs.reduce((a, o) => a + inter(blk, o), 0);
      if (mode === 'opt' && j.gen) { prod += j.e - j.s; packGen += lost; }
      else { prod += j.e - j.s - lost; if (lost > 0) restarts++; }
    });
  });
  const outMin = outs.reduce((a, o) => a + o.e - o.s, 0); // cold storage always on generator during outages
  const kwh = 60 * outMin / 60 + 45 * packGen / 60;
  return { prod: prod / 60, restarts, diesel: Math.round(kwh * 0.27), deferred };
}
